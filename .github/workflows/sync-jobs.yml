
name: Sync Recruitment Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest recruitment data
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xixicc186/xixicc2027/main/jobs.json \
            -o jobs.json

      - name: Validate JSON
        run: python3 -m json.tool jobs.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync recruitment data"
            git push
          fi
